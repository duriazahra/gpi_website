<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#vpBg)"/>
  <circle cx="200" cy="190" r="140" fill="#047857" opacity="0.3"/>

  <!-- Suit Shoulders -->
  <path d="M 70,400 L 120,290 L 165,300 L 200,340 L 235,300 L 280,290 L 330,400 Z" fill="#1e293b"/>
  <!-- White Shirt -->
  <polygon points="160,250 200,315 175,325 150,265" fill="#f8fafc"/>
  <polygon points="240,250 200,315 225,325 250,265" fill="#f8fafc"/>
  <!-- Blue Tie -->
  <polygon points="190,265 210,265 218,360 200,380 182,360" fill="#0284c7"/>
  <polygon points="190,265 210,265 208,280 192,280" fill="#0369a1"/>

  <!-- Lapels -->
  <polygon points="120,290 170,360 160,250" fill="#334155"/>
  <polygon points="280,290 230,360 240,250" fill="#334155"/>

  <!-- Neck -->
  <rect x="175" y="210" width="50" height="55" fill="#df9e76" rx="4"/>
  <!-- Head / Face -->
  <ellipse cx="200" cy="175" rx="54" ry="64" fill="#df9e76"/>
  <!-- Ears -->
  <ellipse cx="146" cy="180" rx="9" ry="15" fill="#d18a5e"/>
  <ellipse cx="254" cy="180" rx="9" ry="15" fill="#d18a5e"/>

  <!-- Hair -->
  <path d="M 146,165 C 146,105 160,95 200,95 C 240,95 254,105 254,165 C 245,120 235,110 200,110 C 165,110 155,120 146,165 Z" fill="#1c1917"/>

  <!-- Eyebrows -->
  <path d="M 165,160 Q 180,154 190,160" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 210,160 Q 220,154 235,160" stroke="#1c1917" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <circle cx="177" cy="172" r="4" fill="#1e293b"/>
  <circle cx="223" cy="172" r="4" fill="#1e293b"/>
  <!-- Nose -->
  <path d="M 200,172 L 197,196 L 204,196" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M 188,216 Q 200,224 212,216" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
</svg>
