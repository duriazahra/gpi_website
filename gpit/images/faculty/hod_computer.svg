  </defs>
  <rect width="400" height="400" fill="url(#compBg)"/>
  <circle cx="200" cy="190" r="140" fill="#0284c7" opacity="0.3"/>

  <!-- Professional Academic Dress & Hijab/Scarf Styling -->
  <path d="M 70,400 L 120,290 L 165,300 L 200,340 L 235,300 L 280,290 L 330,400 Z" fill="#1e293b"/>
  
