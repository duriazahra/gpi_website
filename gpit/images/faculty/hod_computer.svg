  <!-- Eyebrows -->
  <path d="M 172,168 Q 183,163 192,167" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 208,167 Q 217,163 228,168" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes with lashes -->
