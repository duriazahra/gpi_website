  <rect x="204" y="169" width="26" height="18" rx="3" fill="none" stroke="#ca8a04" stroke-width="2"/>
  <line x1="196" y1="177" x2="204" y2="177" stroke="#ca8a04" stroke-width="2"/>

  <!-- Nose -->
