<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ewBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#ewBg)"/>
  <!-- Soldering Iron & PCB Workstation -->
  <rect x="80" y="100" width="440" height="200" fill="#065f46" stroke="#10b981" stroke-width="4" rx="8"/>
  <!-- PCB Circuit Tracks -->
  <g stroke="#34d399" stroke-width="2.5" fill="none">
    <path d="M 120,130 L 180,130 L 210,160 L 290,160"/>
    <path d="M 120,180 L 160,180 L 180,200 L 260,200"/>
    <path d="M 320,140 L 400,140 L 430,170 L 480,170"/>
    <path d="M 320,240 L 360,240 L 390,210 L 480,210"/>
  </g>
  <circle cx="120" cy="130" r="5" fill="#facc15"/><circle cx="290" cy="160" r="5" fill="#facc15"/>
  <circle cx="120" cy="180" r="5" fill="#facc15"/><circle cx="480" cy="170" r="5" fill="#facc15"/>
  
  <!-- IC Chip -->
  <rect x="230" y="140" width="80" height="45" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="245" cy="162" r="4" fill="#ef4444"/>

  <!-- Soldering Iron Pen -->
  <line x1="390" y1="120" x2="480" y2="40" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <line x1="365" y1="140" x2="390" y2="120" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="363" cy="142" r="3" fill="#fde047"/>

  <!-- Banner -->
  <rect x="150" y="325" width="300" height="45" rx="22.5" fill="#047857" opacity="0.95"/>
  <text x="300" y="353" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">PCB Design &amp; Soldering Lab</text>
</svg>
