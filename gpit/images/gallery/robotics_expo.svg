<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="robBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#robBg)"/>
  <!-- Circuit Grid -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="50" x2="200" y2="50"/>
    <line x1="200" y1="50" x2="250" y2="100"/>
    <line x1="250" y1="100" x2="400" y2="100"/>
    <circle cx="200" cy="50" r="4" fill="#38bdf8"/>
    <circle cx="250" cy="100" r="4" fill="#38bdf8"/>
  </g>
  <!-- Futuristic Robot Head / Arm -->
  <g transform="translate(240, 110)">
    <rect x="0" y="0" width="120" height="90" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <!-- Visor -->
    <rect x="20" y="25" width="80" height="24" rx="12" fill="#0284c7"/>
    <circle cx="45" cy="37" r="6" fill="#38bdf8"/>
    <circle cx="75" cy="37" r="6" fill="#38bdf8"/>
    <!-- Antenna -->
    <line x1="60" y1="0" x2="60" y2="-30" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="60" cy="-35" r="8" fill="#f59e0b"/>
  </g>
  <rect x="150" y="320" width="300" height="45" rx="22.5" fill="#0284c7" opacity="0.95"/>
  <text x="300" y="348" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">All-Pakistan Robotics Expo</text>
</svg>
