<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="weldBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#weldBg)"/>
  <!-- Welding Mask Silhouette & Arc Torch with Sparks -->
  <!-- Welding Mask -->
  <g transform="translate(180, 80)">
    <path d="M 40,20 C 10,60 10,130 35,170 C 60,200 110,200 135,170 C 160,130 160,60 130,20 Z" fill="#09090b" stroke="#3f3f46" stroke-width="4"/>
    <!-- Glass Filter Window -->
    <rect x="60" y="75" width="50" height="30" rx="3" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
  </g>
  <!-- Arc Torch -->
  <line x1="390" y1="160" x2="470" y2="210" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <line x1="365" y1="145" x2="390" y2="160" stroke="#a1a1aa" stroke-width="6"/>
  <!-- Arc Flash -->
  <circle cx="360" cy="142" r="14" fill="#ffffff"/>
  <circle cx="360" cy="142" r="30" fill="#38bdf8" opacity="0.4"/>
  <!-- Sparks -->
  <g stroke="#fef08a" stroke-width="2">
    <line x1="360" y1="142" x2="320" y2="120"/>
    <line x1="360" y1="142" x2="330" y2="170"/>
    <line x1="360" y1="142" x2="390" y2="110"/>
    <line x1="360" y1="142" x2="375" y2="185"/>
  </g>
  <!-- Banner -->
  <rect x="150" y="325" width="300" height="45" rx="22.5" fill="#ea580c" opacity="0.95"/>
  <text x="300" y="353" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Arc &amp; Gas Welding Facility</text>
</svg>
