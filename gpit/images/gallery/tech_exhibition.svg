<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="exhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#exhBg)"/>
  <!-- Exhibition Booth & Project Display -->
  <polygon points="100,240 500,240 540,310 60,310" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Display Poster Board -->
  <rect x="180" y="80" width="240" height="140" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" rx="4"/>
  <text x="300" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#f59e0b" text-anchor="middle">SOLAR SMART INVERTER</text>
  <rect x="205" y="130" width="190" height="70" rx="3" fill="#1e293b"/>
  <!-- Solar cells diagram -->
  <g stroke="#38bdf8" stroke-width="1.5">
    <rect x="220" y="140" width="40" height="50" fill="#0284c7"/>
    <rect x="280" y="140" width="40" height="50" fill="#0284c7"/>
    <rect x="340" y="140" width="40" height="50" fill="#0284c7"/>
  </g>
  <!-- Prototype on table -->
  <rect x="250" y="220" width="100" height="40" fill="#475569" rx="4"/>
  <circle cx="270" cy="240" r="6" fill="#22c55e"/>
  <circle cx="290" cy="240" r="6" fill="#ef4444"/>
  <line x1="310" y1="235" x2="335" y2="235" stroke="#f59e0b" stroke-width="3"/>
  <!-- Banner -->
  <rect x="150" y="330" width="300" height="45" rx="22.5" fill="#0f172a" opacity="0.95"/>
  <text x="300" y="358" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Student Technical Project Expo</text>
</svg>
