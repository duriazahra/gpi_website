<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgAct)"/>

  <!-- Sports / Robotics / Technical Society Arena Silhouette -->
  <circle cx="400" cy="250" r="180" fill="#059669" opacity="0.4"/>
  <circle cx="400" cy="250" r="130" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- Technical Trophy / Award in Center -->
  <polygon points="380,360 420,360 425,375 375,375" fill="#ca8a04"/>
  <rect x="390" y="270" width="20" height="90" fill="#eab308"/>
  <path d="M 360,180 C 360,260 440,260 440,180 Z" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
  <!-- Trophy Handles -->
  <path d="M 360,195 C 330,195 330,235 365,240" fill="none" stroke="#facc15" stroke-width="6"/>
  <path d="M 440,195 C 470,195 470,235 435,240" fill="none" stroke="#facc15" stroke-width="6"/>

  <!-- Star on Trophy -->
  <polygon points="400,195 404,208 418,208 407,216 411,228 400,220 389,228 393,216 382,208 396,208" fill="#ffffff"/>

  <!-- Left: Robotics & Science Project -->
  <g transform="translate(140, 200)">
    <rect x="0" y="80" width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <!-- Robot Tracks / Wheels -->
    <ellipse cx="20" cy="155" rx="18" ry="12" fill="#475569"/>
    <ellipse cx="80" cy="155" rx="18" ry="12" fill="#475569"/>
    <rect x="15" y="145" width="70" height="20" fill="#334155"/>
    <!-- Robotic Arm -->
    <line x1="50" y1="80" x2="30" y2="30" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="60" y2="0" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="60" cy="0" r="8" fill="#ef4444"/>
    <text x="50" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">ROBOTICS</text>
  </g>

  <!-- Right: Sports & Cricket/Badminton Icons -->
  <g transform="translate(580, 220)">
    <!-- Cricket Bat & Ball -->
    <rect x="25" y="0" width="18" height="110" rx="4" fill="#d97706" transform="rotate(25 25 0)"/>
    <rect x="30" y="-35" width="8" height="40" rx="3" fill="#cbd5e1" transform="rotate(25 25 0)"/>
    <circle cx="80" cy="90" r="16" fill="#dc2626"/>
    <circle cx="80" cy="90" r="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Badge -->
  <rect x="250" y="445" width="300" height="36" rx="18" fill="#0f2b5c" opacity="0.95"/>
  <text x="400" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Sports, Tech Competitions &amp; Societies</text>
</svg>
