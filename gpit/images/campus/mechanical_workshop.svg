<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgShop)"/>

  <!-- Workshop Tool Board on Wall (Background) -->
  <rect x="60" y="40" width="300" height="180" fill="#0f172a" stroke="#475569" stroke-width="3" rx="4"/>
  <!-- Pegboard holes simulation -->
  <g fill="#334155">
    <circle cx="80" cy="60" r="3"/><circle cx="110" cy="60" r="3"/><circle cx="140" cy="60" r="3"/>
    <circle cx="80" cy="90" r="3"/><circle cx="110" cy="90" r="3"/><circle cx="140" cy="90" r="3"/>
    <circle cx="80" cy="120" r="3"/><circle cx="110" cy="120" r="3"/><circle cx="140" cy="120" r="3"/>
  </g>
  <!-- Hanging Tools -->
  <!-- Wrenches -->
  <path d="M 180,60 L 180,130 M 175,65 A 10,10 0 1,1 185,65" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 210,70 L 210,140 M 205,75 A 10,10 0 1,1 215,75" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 240,65 L 240,150 M 235,70 A 10,10 0 1,1 245,70" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Hammer -->
  <rect x="290" y="65" width="40" height="20" fill="#64748b" rx="2"/>
  <rect x="306" y="85" width="8" height="85" fill="#b45309" rx="2"/>

  <!-- Safety First Sign -->
  <rect x="520" y="50" width="220" height="70" fill="#facc15" stroke="#ca8a04" stroke-width="3" rx="4"/>
  <text x="630" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#000000" text-anchor="middle">SAFETY FIRST</text>
  <text x="630" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">WEAR EYE &amp; EAR PROTECTION</text>

  <!-- Industrial Lathe & Milling Machine -->
  <!-- Machine Base -->
  <polygon points="120,400 680,400 710,470 90,470" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="140" y="240" width="160" height="160" fill="#0369a1" stroke="#0284c7" stroke-width="3" rx="6"/>
  <!-- Headstock and Chuck -->
  <circle cx="300" cy="290" r="45" fill="url(#metalGrad)" stroke="#1e293b" stroke-width="3"/>
  <circle cx="300" cy="290" r="18" fill="#0f172a"/>
  
  <!-- Workpiece (Steel Cylinder being turned) -->
  <rect x="345" y="278" width="160" height="24" fill="url(#metalGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Lathe Bed Rails -->
  <rect x="300" y="325" width="360" height="40" fill="url(#metalGrad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Tailstock -->
  <rect x="520" y="260" width="110" height="120" fill="#0369a1" stroke="#0284c7" stroke-width="3" rx="4"/>
  <polygon points="520,290 490,290 490,290" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <!-- Handwheel -->
  <circle cx="645" cy="300" r="22" fill="none" stroke="#e2e8f0" stroke-width="6"/>

  <!-- Tool Carriage / Cutting Post with Flying Sparks -->
  <rect x="420" y="295" width="45" height="50" fill="#334155" rx="3"/>
  <polygon points="415,290 435,290 425,305" fill="#f59e0b"/>
  <!-- Sparks -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <line x1="410" y1="285" x2="390" y2="265"/>
    <line x1="415" y1="282" x2="405" y2="255"/>
    <line x1="420" y1="280" x2="425" y2="250"/>
    <line x1="425" y1="282" x2="445" y2="260"/>
  </g>

  <!-- Yellow & Black Hazard Striping -->
  <g transform="translate(0, 475)">
    <rect width="800" height="25" fill="#facc15"/>
    <polygon points="0,0 25,0 0,25" fill="#000"/>
    <polygon points="50,0 100,0 75,25 25,25" fill="#000"/>
    <polygon points="125,0 175,0 150,25 100,25" fill="#000"/>
    <polygon points="200,0 250,0 225,25 175,25" fill="#000"/>
    <polygon points="275,0 325,0 300,25 250,25" fill="#000"/>
    <polygon points="350,0 400,0 375,25 325,25" fill="#000"/>
    <polygon points="425,0 475,0 450,25 400,25" fill="#000"/>
    <polygon points="500,0 550,0 525,25 475,25" fill="#000"/>
    <polygon points="575,0 625,0 600,25 550,25" fill="#000"/>
    <polygon points="650,0 700,0 675,25 625,25" fill="#000"/>
    <polygon points="725,0 775,0 750,25 700,25" fill="#000"/>
  </g>

  <!-- Label Badge -->
  <rect x="250" y="420" width="300" height="36" rx="18" fill="#0f2b5c" opacity="0.95"/>
  <text x="400" y="443" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Heavy Mechanical &amp; Machine Workshop</text>
</svg>
