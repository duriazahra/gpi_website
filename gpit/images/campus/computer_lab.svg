<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Background Room -->
  <rect width="800" height="500" fill="url(#bgLab)"/>
  
  <!-- Perspective Ceiling Lights -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <line x1="200" y1="30" x2="280" y2="30"/>
    <line x1="360" y1="30" x2="440" y2="30"/>
    <line x1="520" y1="30" x2="600" y2="30"/>
  </g>

  <!-- Server Rack on Left -->
  <rect x="50" y="80" width="110" height="340" fill="#0b1120" stroke="#334155" stroke-width="3" rx="4"/>
  <g fill="#0284c7" opacity="0.8">
    <circle cx="80" cy="110" r="4"/>
    <circle cx="95" cy="110" r="4" fill="#22c55e"/>
    <circle cx="110" cy="110" r="4" fill="#f59e0b"/>
    <line x1="70" y1="130" x2="140" y2="130" stroke="#38bdf8" stroke-width="2"/>
    <line x1="70" y1="160" x2="140" y2="160" stroke="#38bdf8" stroke-width="2"/>
    <line x1="70" y1="190" x2="140" y2="190" stroke="#38bdf8" stroke-width="2"/>
    <line x1="70" y1="220" x2="140" y2="220" stroke="#38bdf8" stroke-width="2"/>
    <line x1="70" y1="250" x2="140" y2="250" stroke="#38bdf8" stroke-width="2"/>
    <line x1="70" y1="280" x2="140" y2="280" stroke="#38bdf8" stroke-width="2"/>
    <line x1="70" y1="310" x2="140" y2="310" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Lab Workstation Desks -->
  <!-- Desk Row 1 (Back) -->
  <polygon points="200,240 760,240 730,270 230,270" fill="#334155"/>
  <!-- Small Screens -->
  <g fill="url(#screenGlow)">
    <rect x="260" y="190" width="55" height="40" rx="3"/>
    <rect x="370" y="190" width="55" height="40" rx="3"/>
    <rect x="480" y="190" width="55" height="40" rx="3"/>
    <rect x="590" y="190" width="55" height="40" rx="3"/>
  </g>

  <!-- Desk Row 2 (Front) -->
  <polygon points="180,330 780,330 750,420 180,420" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Monitor 1 -->
  <g>
    <rect x="220" y="240" width="100" height="70" rx="4" fill="url(#screenGlow)" stroke="#0f172a" stroke-width="3"/>
    <!-- Code on screen -->
    <line x1="230" y1="255" x2="280" y2="255" stroke="#ffffff" stroke-width="2"/>
    <line x1="230" y1="265" x2="300" y2="265" stroke="#fde047" stroke-width="2"/>
    <line x1="240" y1="275" x2="290" y2="275" stroke="#86efac" stroke-width="2"/>
    <line x1="240" y1="285" x2="270" y2="285" stroke="#ffffff" stroke-width="2"/>
    <rect x="262" y="310" width="16" height="20" fill="#64748b"/>
    <polygon points="250,330 290,330 295,335 245,335" fill="#475569"/>
    <!-- Keyboard & Mouse -->
    <rect x="235" y="345" width="70" height="15" rx="2" fill="#334155"/>
    <ellipse cx="320" cy="352" rx="7" ry="10" fill="#334155"/>
  </g>

  <!-- Monitor 2 -->
  <g>
    <rect x="380" y="240" width="100" height="70" rx="4" fill="url(#screenGlow)" stroke="#0f172a" stroke-width="3"/>
    <!-- Code/UI on screen -->
    <circle cx="430" cy="275" r="18" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="430" y1="262" x2="430" y2="275" stroke="#fde047" stroke-width="3"/>
    <rect x="422" y="310" width="16" height="20" fill="#64748b"/>
    <polygon points="410,330 450,330 455,335 405,335" fill="#475569"/>
    <rect x="395" y="345" width="70" height="15" rx="2" fill="#334155"/>
    <ellipse cx="480" cy="352" rx="7" ry="10" fill="#334155"/>
  </g>

  <!-- Monitor 3 -->
  <g>
    <rect x="540" y="240" width="100" height="70" rx="4" fill="url(#screenGlow)" stroke="#0f172a" stroke-width="3"/>
    <!-- Network diagram on screen -->
    <circle cx="560" cy="265" r="6" fill="#f59e0b"/>
    <circle cx="610" cy="265" r="6" fill="#f59e0b"/>
    <circle cx="585" cy="290" r="6" fill="#10b981"/>
    <line x1="560" y1="265" x2="610" y2="265" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="560" y1="265" x2="585" y2="290" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="610" y1="265" x2="585" y2="290" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="582" y="310" width="16" height="20" fill="#64748b"/>
    <polygon points="570,330 610,330 615,335 565,335" fill="#475569"/>
    <rect x="555" y="345" width="70" height="15" rx="2" fill="#334155"/>
    <ellipse cx="640" cy="352" rx="7" ry="10" fill="#334155"/>
  </g>

  <!-- High-Tech Header Badge -->
  <rect x="300" y="440" width="220" height="35" rx="17.5" fill="#0284c7" opacity="0.9"/>
  <text x="410" y="463" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Modern Computing &amp; IT Lab</text>
</svg>
