<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgClass)"/>

  <!-- Smart Interactive Whiteboard (Center Wall) -->
  <rect x="180" y="60" width="440" height="230" fill="#0f172a" stroke="#cbd5e1" stroke-width="6" rx="6"/>
  <!-- Smart Board Header & Grid -->
  <rect x="186" y="66" width="428" height="30" fill="#1e3a8a"/>
  <text x="210" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Smart Digital Lecture Hall • Engineering Mathematics &amp; Physics</text>

  <!-- Technical Equations on Board -->
  <text x="230" y="140" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#38bdf8">V = I × R  |  P = V × I = I²R</text>
  <text x="230" y="180" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#facc15">F = m × a  |  τ = r × F × sin(θ)</text>
  <text x="230" y="220" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#4ade80">η = (Output Power / Input Power) × 100%</text>

  <!-- Sine wave graph on board -->
  <path d="M 460,250 Q 485,220 510,250 T 560,250 T 600,250" fill="none" stroke="#f43f5e" stroke-width="3"/>

  <!-- Lecturer Podium on Left -->
  <polygon points="100,280 160,280 180,430 80,430" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <rect x="115" y="255" width="40" height="25" rx="2" fill="#0284c7"/>
  <line x1="145" y1="280" x2="155" y2="260" stroke="#f59e0b" stroke-width="3"/> <!-- Mic -->

  <!-- Tiered Student Desks -->
  <!-- Tier 1 (Back) -->
  <polygon points="120,330 760,330 720,370 140,370" fill="#3b82f6" opacity="0.3"/>
  
  <!-- Tier 2 (Front) -->
  <polygon points="60,400 780,400 740,460 40,460" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="80" y="460" width="20" height="40" fill="#0f172a"/>
  <rect x="700" y="460" width="20" height="40" fill="#0f172a"/>

  <!-- Student notebooks/tablets on front desk -->
  <rect x="120" y="415" width="60" height="35" rx="2" fill="#ffffff"/>
  <rect x="260" y="410" width="80" height="45" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="420" y="415" width="60" height="35" rx="2" fill="#ffffff"/>
  <rect x="580" y="410" width="80" height="45" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="250" y="445" width="300" height="36" rx="18" fill="#0f2b5c" opacity="0.95"/>
  <text x="400" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Modern Multimedia Classrooms</text>
</svg>
