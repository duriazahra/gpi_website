<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCivil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgCivil)"/>

  <!-- Blueprint Architectural Plan Background -->
  <rect x="50" y="40" width="700" height="280" fill="#0369a1" opacity="0.25" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <!-- Blueprint Grid -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.3">
    <line x1="50" y1="90" x2="750" y2="90"/>
    <line x1="50" y1="140" x2="750" y2="140"/>
    <line x1="50" y1="190" x2="750" y2="190"/>
    <line x1="50" y1="240" x2="750" y2="240"/>
    <line x1="150" y1="40" x2="150" y2="320"/>
    <line x1="300" y1="40" x2="300" y2="320"/>
    <line x1="450" y1="40" x2="450" y2="320"/>
    <line x1="600" y1="40" x2="600" y2="320"/>
  </g>
  <!-- Architectural building plan lines -->
  <rect x="180" y="80" width="220" height="150" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="230" y="110" width="70" height="90" fill="none" stroke="#fde047" stroke-width="1.5"/>
  <rect x="330" y="110" width="50" height="50" fill="none" stroke="#fde047" stroke-width="1.5"/>

  <!-- Surveying Total Station / Theodolite on Tripod (Center Right) -->
  <!-- Tripod Legs -->
  <g stroke="#e2e8f0" stroke-width="6" stroke-linecap="round">
    <line x1="540" y1="210" x2="470" y2="440"/>
    <line x1="540" y1="210" x2="540" y2="440"/>
    <line x1="540" y1="210" x2="610" y2="440"/>
  </g>
  <!-- Tripod Head & Level Screws -->
  <polygon points="520,215 560,215 540,230" fill="#f59e0b"/>
  <!-- Theodolite Body (Yellow & Black) -->
  <rect x="525" y="150" width="30" height="60" fill="#facc15" rx="3"/>
  <circle cx="540" cy="175" r="14" fill="#0f172a"/>
  <!-- Optical Telescope Sight -->
  <rect x="495" y="167" width="90" height="16" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
  <circle cx="495" cy="175" r="9" fill="#38bdf8"/>
  <circle cx="585" cy="175" r="7" fill="#64748b"/>

  <!-- Left: Concrete & Material Strength Compression Tester -->
  <rect x="100" y="180" width="160" height="230" fill="#334155" stroke="#64748b" stroke-width="3" rx="6"/>
  <!-- Compression Cylinder & Dial Gauge -->
  <circle cx="180" cy="225" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <line x1="180" y1="225" x2="195" y2="215" stroke="#ef4444" stroke-width="2.5"/>
  <rect x="150" y="270" width="60" height="60" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="180" y="305" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">CONCRETE</text>
  <rect x="135" y="340" width="90" height="20" fill="#0f172a"/>

  <!-- Floor Line -->
  <rect y="440" width="800" height="60" fill="#0f172a"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#334155" stroke-width="4"/>

  <!-- Badge -->
  <rect x="250" y="445" width="300" height="36" rx="18" fill="#0284c7" opacity="0.95"/>
  <text x="400" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Civil Engineering &amp; Surveying Lab</text>
</svg>
