<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgElec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091b38"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgElec)"/>

  <!-- Grid Blueprint lines on wall -->
  <g stroke="#1e3a8a" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
  </g>

  <!-- Electrical Power Test Bench (Center Left) -->
  <rect x="80" y="140" width="340" height="230" fill="url(#panelGrad)" stroke="#475569" stroke-width="4" rx="8"/>
  <rect x="100" y="160" width="300" height="50" fill="#0f172a" rx="4"/>
  <!-- Oscilloscope Display -->
  <rect x="110" y="165" width="80" height="40" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="2"/>
  <!-- Sine Wave on display -->
  <path d="M 115,185 Q 125,170 135,185 T 155,185 T 175,185" fill="none" stroke="#34d399" stroke-width="2.5"/>
  
  <!-- Digital Voltage Meters -->
  <rect x="210" y="165" width="80" height="40" fill="#18181b" rx="2"/>
  <text x="250" y="191" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#ef4444" text-anchor="middle">230.4 V</text>

  <rect x="310" y="165" width="75" height="40" fill="#18181b" rx="2"/>
  <text x="347" y="191" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">14.8 A</text>

  <!-- Circuit Knobs & Switches -->
  <g fill="#334155">
    <circle cx="130" cy="240" r="14" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="180" cy="240" r="14" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="230" cy="240" r="14" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="280" cy="240" r="14" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="330" cy="240" r="14" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="380" cy="240" r="14" stroke="#e2e8f0" stroke-width="3"/>
  </g>

  <!-- Terminal Connection Points -->
  <g>
    <circle cx="130" cy="290" r="8" fill="#ef4444"/>
    <circle cx="180" cy="290" r="8" fill="#ef4444"/>
    <circle cx="230" cy="290" r="8" fill="#3b82f6"/>
    <circle cx="280" cy="290" r="8" fill="#3b82f6"/>
    <circle cx="330" cy="290" r="8" fill="#22c55e"/>
    <circle cx="380" cy="290" r="8" fill="#eab308"/>
    <!-- Test Wires -->
    <path d="M 130,290 C 140,360 270,360 280,290" fill="none" stroke="#ef4444" stroke-width="4"/>
    <path d="M 180,290 C 190,340 320,340 330,290" fill="none" stroke="#3b82f6" stroke-width="4"/>
  </g>

  <!-- High Voltage Safety Warning Sign -->
  <polygon points="250,335 268,365 232,365" fill="#facc15" stroke="#000" stroke-width="1.5"/>
  <path d="M 250,342 L 246,354 L 253,354 L 249,363" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Right Side: Electric Motor & Transformer Unit -->
  <!-- Transformer Base -->
  <rect x="490" y="200" width="230" height="170" fill="#334155" stroke="#64748b" stroke-width="3" rx="6"/>
  <!-- Motor Cylinder -->
  <rect x="520" y="150" width="170" height="100" fill="#475569" rx="10"/>
  <!-- Cooling fins -->
  <line x1="535" y1="150" x2="535" y2="250" stroke="#1e293b" stroke-width="3"/>
  <line x1="555" y1="150" x2="555" y2="250" stroke="#1e293b" stroke-width="3"/>
  <line x1="575" y1="150" x2="575" y2="250" stroke="#1e293b" stroke-width="3"/>
  <line x1="595" y1="150" x2="595" y2="250" stroke="#1e293b" stroke-width="3"/>
  <line x1="615" y1="150" x2="615" y2="250" stroke="#1e293b" stroke-width="3"/>
  <line x1="635" y1="150" x2="635" y2="250" stroke="#1e293b" stroke-width="3"/>
  <line x1="655" y1="150" x2="655" y2="250" stroke="#1e293b" stroke-width="3"/>
  <line x1="675" y1="150" x2="675" y2="250" stroke="#1e293b" stroke-width="3"/>
  
  <!-- Rotor Shaft -->
  <rect x="690" y="185" width="40" height="30" fill="#94a3b8" rx="3"/>
  <ellipse cx="730" cy="200" rx="10" ry="25" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>

  <!-- Bench Platform Surface -->
  <rect y="370" width="800" height="130" fill="#1e293b"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#475569" stroke-width="5"/>

  <!-- Badge -->
  <rect x="260" y="440" width="280" height="36" rx="18" fill="#d97706" opacity="0.95"/>
  <text x="400" y="464" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Electrical &amp; Electronics Engineering Lab</text>
</svg>
