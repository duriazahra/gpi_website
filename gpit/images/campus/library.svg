<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgLib)"/>

  <!-- Grand Bookshelves Wall -->
  <g fill="#451a03" stroke="#78350f" stroke-width="3">
    <!-- Shelf 1 -->
    <rect x="60" y="50" width="200" height="320"/>
    <!-- Shelf 2 -->
    <rect x="300" y="50" width="200" height="320"/>
    <!-- Shelf 3 -->
    <rect x="540" y="50" width="200" height="320"/>
  </g>

  <!-- Books Rows -->
  <g>
    <!-- Row 1 Books in Shelf 1 -->
    <rect x="70" y="70" width="16" height="60" fill="#dc2626"/>
    <rect x="88" y="65" width="14" height="65" fill="#f59e0b"/>
    <rect x="104" y="60" width="20" height="70" fill="#2563eb"/>
    <rect x="126" y="68" width="15" height="62" fill="#16a34a"/>
    <rect x="143" y="62" width="18" height="68" fill="#9333ea"/>
    <rect x="163" y="65" width="22" height="65" fill="#0284c7"/>
    <rect x="187" y="70" width="15" height="60" fill="#ea580c"/>
    <rect x="204" y="64" width="18" height="66" fill="#e11d48"/>
    <rect x="224" y="68" width="18" height="62" fill="#ca8a04"/>

    <!-- Row 2 Books -->
    <rect x="70" y="160" width="22" height="70" fill="#2563eb"/>
    <rect x="94" y="165" width="18" height="65" fill="#16a34a"/>
    <rect x="114" y="158" width="25" height="72" fill="#dc2626"/>
    <rect x="141" y="164" width="16" height="66" fill="#f59e0b"/>
    <rect x="159" y="160" width="20" height="70" fill="#0284c7"/>
    <rect x="181" y="168" width="18" height="62" fill="#9333ea"/>
    <rect x="201" y="162" width="24" height="68" fill="#e11d48"/>
    <rect x="227" y="165" width="15" height="65" fill="#10b981"/>

    <!-- Middle Shelf Books -->
    <rect x="310" y="70" width="20" height="65" fill="#0284c7"/>
    <rect x="332" y="62" width="24" height="73" fill="#ea580c"/>
    <rect x="358" y="66" width="18" height="69" fill="#16a34a"/>
    <rect x="378" y="70" width="22" height="65" fill="#e11d48"/>
    <rect x="402" y="64" width="19" height="71" fill="#f59e0b"/>
    <rect x="423" y="60" width="25" height="75" fill="#2563eb"/>
    <rect x="450" y="68" width="20" height="67" fill="#9333ea"/>

    <!-- Right Shelf Books -->
    <rect x="550" y="70" width="24" height="65" fill="#f59e0b"/>
    <rect x="576" y="63" width="18" height="72" fill="#dc2626"/>
    <rect x="596" y="68" width="22" height="67" fill="#0284c7"/>
    <rect x="620" y="60" width="20" height="75" fill="#16a34a"/>
    <rect x="642" y="65" width="26" height="70" fill="#ea580c"/>
    <rect x="670" y="70" width="18" height="65" fill="#2563eb"/>
    <rect x="690" y="62" width="22" height="73" fill="#9333ea"/>
  </g>

  <!-- Study Table & Modern Reading Pod in Foreground -->
  <polygon points="120,380 680,380 740,460 60,460" fill="#78350f" stroke="#b45309" stroke-width="3"/>
  <rect x="140" y="460" width="30" height="40" fill="#451a03"/>
  <rect x="630" y="460" width="30" height="40" fill="#451a03"/>

  <!-- Table Lamps with Warm Light -->
  <g>
    <!-- Left Lamp -->
    <rect x="230" y="340" width="8" height="40" fill="#d97706"/>
    <path d="M 215,340 L 253,340 L 245,320 L 223,320 Z" fill="#fef08a"/>
    <circle cx="234" cy="335" r="25" fill="#fef08a" opacity="0.2"/>
    <!-- Open Book on table -->
    <polygon points="260,395 285,395 295,410 270,410" fill="#f8fafc"/>
    <polygon points="285,395 310,395 320,410 295,410" fill="#f1f5f9"/>

    <!-- Right Laptop on table -->
    <rect x="490" y="345" width="80" height="50" rx="4" fill="#0284c7" stroke="#0f172a" stroke-width="2"/>
    <polygon points="480,395 580,395 590,405 470,405" fill="#cbd5e1"/>
    <!-- Right Lamp -->
    <rect x="610" y="340" width="8" height="40" fill="#d97706"/>
    <path d="M 595,340 L 633,340 L 625,320 L 603,320 Z" fill="#fef08a"/>
  </g>

  <!-- Badge -->
  <rect x="240" y="445" width="320" height="36" rx="18" fill="#d97706" opacity="0.95"/>
  <text x="400" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Central Library &amp; Digital Resource Center</text>
</svg>
