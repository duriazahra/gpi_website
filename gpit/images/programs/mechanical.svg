    <path d="M -25,-5 L -25,5 L -18,4 L -18,-4 Z" fill="#f59e0b"/>
    <path d="M 25,-5 L 25,5 L 18,4 L 18,-4 Z" fill="#f59e0b"/>
    <path d="M -16,-16 L -9,-23 L -4,-18 L -11,-11 Z" fill="#f59e0b"/>
    <path d="M 16,16 L 9,23 L 4,18 L 11,11 Z" fill="#f59e0b"/>
    <path d="M -16,16 L -23,9 L -18,4 L -11,11 Z" fill="#f59e0b"/>
    <path d="M 16,-16 L 23,-9 L 18,-4 L 11,-11 Z" fill="#f59e0b"/>
  </g>
  <!-- Gear 2 (Small) -->
  <g transform="translate(68, 68)">
    <circle cx="0" cy="0" r="12" fill="#94a3b8"/>
    <circle cx="0" cy="0" r="5" fill="#1e293b"/>
