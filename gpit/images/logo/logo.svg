<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="Govt Polytechnic Institute Official Emblem">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d3d" />
      <stop offset="100%" stop-color="#0f2b5c" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <path id="textCircleTop" d="M 75,250 A 175,175 0 0,1 425,250" fill="none" />
    <path id="textCircleBottom" d="M 420,250 A 170,170 0 0,1 80,250" fill="none" />
  </defs>

  <!-- Outer Ring Shadow & Base -->
  <circle cx="250" cy="250" r="235" fill="url(#navyGrad)" filter="url(#dropShadow)"/>
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="250" cy="250" r="217" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Inner Rings -->
  <circle cx="250" cy="250" r="168" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="250" cy="250" r="160" fill="url(#navyGrad)"/>

  <!-- Circular Text -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20.5" font-weight="800" fill="#ffffff" letter-spacing="4.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      GOVT POLYTECHNIC INSTITUTE
    </textPath>
  </text>

  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ TECHNICAL EDUCATION &amp; SKILLS ★
    </textPath>
  </text>

  <!-- Central Crest Area -->
  <g transform="translate(250, 245)">
    <!-- Outer Gear Silhouette (Technical/Polytechnic Symbol) -->
    <g fill="url(#goldGrad)" opacity="0.95">
      <!-- 12-tooth gear -->
      <path d="M -20,-115 L 20,-115 L 16,-92 A 92,92 0 0,1 55,-74 L 75,-88 L 102,-60 L 88,-40 A 92,92 0 0,1 106,-1 L 129,3 L 129,43 L 106,47 A 92,92 0 0,1 88,86 L 102,106 L 75,134 L 55,120 A 92,92 0 0,1 16,138 L 20,161 L -20,161 L -16,138 A 92,92 0 0,1 -55,120 L -75,134 L -102,106 L -88,86 A 92,92 0 0,1 -106,47 L -129,43 L -129,3 L -106,-1 A 92,92 0 0,1 -88,-40 L -102,-60 L -75,-88 L -55,-74 A 92,92 0 0,1 -16,-92 Z"/>
    </g>

    <!-- Inner Shield Background -->
    <circle cx="0" cy="23" r="82" fill="#091b38" stroke="#ffffff" stroke-width="3"/>

    <!-- Electronics / Science Atomic Rings -->
    <ellipse cx="0" cy="23" rx="72" ry="24" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2.5" transform="rotate(30 0 23)"/>
    <ellipse cx="0" cy="23" rx="72" ry="24" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2.5" transform="rotate(-30 0 23)"/>

    <!-- Central Torch of Knowledge -->
    <path d="M 0,-32 C -14,-8 -5,6 0,15 C 5,6 14,-8 0,-32 Z" fill="#f59e0b"/>
    <path d="M 0,-24 C -7,-6 -2,4 0,10 C 2,4 7,-6 0,-24 Z" fill="#fbbf24"/>
    <path d="M 0,-15 C -3,-2 0,4 0,7 C 0,4 3,-2 0,-15 Z" fill="#ffffff"/>
    
    <!-- Torch Handle -->
    <path d="M -12,14 L 12,14 L 9,28 L -9,28 Z" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M -6,28 L 6,28 L 4,52 L -4,52 Z" fill="#b45309"/>

    <!-- Open Book of Knowledge -->
    <g transform="translate(0, 52)">
      <!-- Left Page -->
      <path d="M 0,0 C -18,-9 -42,-9 -54,-2 L -54,26 C -42,19 -18,19 0,26 Z" fill="#ffffff" stroke="#0a1d3d" stroke-width="1.5"/>
      <!-- Right Page -->
      <path d="M 0,0 C 18,-9 42,-9 54,-2 L 54,26 C 42,19 18,19 0,26 Z" fill="#ffffff" stroke="#0a1d3d" stroke-width="1.5"/>
      <!-- Book spine lines -->
      <path d="M 0,0 L 0,27" stroke="#d97706" stroke-width="2.5"/>
      <line x1="-46" y1="7" x2="-10" y2="7" stroke="#64748b" stroke-width="1.5"/>
      <line x1="-46" y1="13" x2="-10" y2="13" stroke="#64748b" stroke-width="1.5"/>
      <line x1="-46" y1="19" x2="-18" y2="19" stroke="#64748b" stroke-width="1.5"/>
      <line x1="10" y1="7" x2="46" y2="7" stroke="#64748b" stroke-width="1.5"/>
      <line x1="10" y1="13" x2="46" y2="13" stroke="#64748b" stroke-width="1.5"/>
      <line x1="18" y1="19" x2="46" y2="19" stroke="#64748b" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Laurel Wreath Around Base -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 125,320 C 110,345 115,385 140,410 C 160,395 160,375 145,355 Z"/>
    <path d="M 155,365 C 145,390 155,425 185,440 C 200,420 195,400 175,385 Z"/>
    <path d="M 375,320 C 390,345 385,385 360,410 C 340,395 340,375 355,355 Z"/>
    <path d="M 345,365 C 355,390 345,425 315,440 C 300,420 305,400 325,385 Z"/>
  </g>

  <!-- Bottom Ribbon Banner with Motto -->
  <g transform="translate(250, 440)">
    <!-- Ribbon ends -->
    <path d="M -170,12 L -200,28 L -170,44 L -150,28 Z" fill="#92400e"/>
    <path d="M 170,12 L 200,28 L 170,44 L 150,28 Z" fill="#92400e"/>
    <!-- Ribbon body -->
    <path d="M -160,10 L 160,10 C 175,10 180,24 170,38 L 150,42 L -150,42 L -170,38 C -180,24 -175,10 -160,10 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" filter="url(#dropShadow)"/>
    <text y="30" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14.5" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="2.5">
      SKILL • DISCIPLINE • EXCELLENCE
    </text>
  </g>
</svg>
